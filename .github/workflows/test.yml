name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test "test/*.test.mjs"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint (checksum-verified release)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint" -color'

  # `uses: ./` against test/fixture: a passing and a failing scenario.
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Both scenarios, fail-on-error false
        id: both
        uses: ./
        with:
          working-directory: test/fixture
          port: '3790'
          fail-on-error: 'false'
          artifact-name: self-test-${{ matrix.os }}-both

      - name: Assert outputs and results.json
        shell: bash
        env:
          TOTAL: ${{ steps.both.outputs.total }}
          PASSED: ${{ steps.both.outputs.passed }}
          FAILED: ${{ steps.both.outputs.failed }}
          RESULTS: ${{ steps.both.outputs.results }}
          ARTIFACT_URL: ${{ steps.both.outputs.artifact-url }}
        run: |
          echo "total=$TOTAL passed=$PASSED failed=$FAILED results=$RESULTS artifact-url=$ARTIFACT_URL"
          test "$TOTAL" = 2
          test "$PASSED" = 1
          test "$FAILED" = 1
          test -n "$ARTIFACT_URL"
          node -e '
            const results = JSON.parse(require("node:fs").readFileSync(process.env.RESULTS, "utf8"));
            const ids = results.scenarios.map((entry) => entry.scenarioId + "=" + entry.exitCode);
            console.log(ids.join(" "));
            if (results.schemaVersion !== 1) throw new Error("schemaVersion");
            if (ids.join(" ") !== "demoflow/failing.demo.json=1 demoflow/passing.demo.json=0") throw new Error("scenarios");
          '

      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: self-test-${{ matrix.os }}-both
          path: ${{ runner.temp }}/self-test-download

      - name: Assert the artifact holds passing/demo.mp4
        shell: bash
        run: |
          ls -lR "$RUNNER_TEMP/self-test-download"
          test -s "$RUNNER_TEMP/self-test-download/passing/demo.mp4"
          test -s "$RUNNER_TEMP/self-test-download/passing/result.json"

      - name: Both scenarios, fail-on-error true
        id: strict
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture
          port: '3790'
          artifact-name: self-test-${{ matrix.os }}-strict

      - name: Assert the failed demo failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.strict.outcome }}
        run: |
          echo "outcome=$OUTCOME"
          test "$OUTCOME" = failure

      - name: The passing scenario alone
        id: single
        uses: ./
        with:
          working-directory: test/fixture
          scenarios: demoflow/passing.demo.json
          port: '3790'
          artifact-name: self-test-${{ matrix.os }}-single

      - name: Assert one scenario passed
        shell: bash
        env:
          TOTAL: ${{ steps.single.outputs.total }}
          PASSED: ${{ steps.single.outputs.passed }}
        run: |
          test "$TOTAL" = 1
          test "$PASSED" = 1

  # The sticky comment and the previews branch, end to end: two runs with one
  # artifact-name leave one comment and only the latest preview directory.
  # A fork's token is read-only, so same-repository pull requests only.
  pr-comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      NAME: self-test-pr-comment
      BRANCH: demoflow-previews
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: First run
        id: first
        uses: ./
        with:
          working-directory: test/fixture
          port: '3790'
          fail-on-error: 'false'
          artifact-name: self-test-pr-comment

      # Both runs of one job share run_id-run_attempt, so plant what the second
      # run must prune: an older directory of this PR and an expired one of
      # another PR, as an orphan commit like the action's own.
      - name: Seed a stale and an expired preview directory
        shell: bash
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$base" --jq .tree.sha)
          meta='{"createdAt":"2000-01-01T00:00:00.000Z"}'
          recent="{\"createdAt\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"}"
          new_tree=$(jq -n --arg base "$tree" --arg stale "pr-$PR/$NAME/1-1/meta.json" --arg expired "pr-0/$NAME/1-1/meta.json" \
              --arg recent "$recent" --arg meta "$meta" \
              '{base_tree: $base, tree: [
                 {path: $stale, mode: "100644", type: "blob", content: $recent},
                 {path: $expired, mode: "100644", type: "blob", content: $meta}]}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg tree "$new_tree" '{message: "self-test seed", tree: $tree, parents: []}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$commit" -F force=true --silent

      - name: Second run
        id: second
        uses: ./
        with:
          working-directory: test/fixture
          port: '3790'
          fail-on-error: 'false'
          artifact-name: self-test-pr-comment

      - name: Assert one comment, an image for passing, and only the latest directory
        shell: bash
        env:
          FIRST_URL: ${{ steps.first.outputs.comment-url }}
          SECOND_URL: ${{ steps.second.outputs.comment-url }}
        run: |
          echo "first=$FIRST_URL second=$SECOND_URL"
          test -n "$SECOND_URL"
          test "$FIRST_URL" = "$SECOND_URL"
          marker="<!-- demoflow-action:$NAME -->"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .body" > "$RUNNER_TEMP/bodies.txt"
          count=$(grep -c -F "$marker" "$RUNNER_TEMP/bodies.txt")
          echo "marker comments: $count"
          test "$count" = 1
          dir="pr-$PR/$NAME/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          grep -F "<img src=\"https://github.com/$GITHUB_REPOSITORY/raw/$BRANCH/$dir/passing.gif\"" "$RUNNER_TEMP/bodies.txt"
          gh api "repos/$GITHUB_REPOSITORY/contents/$dir/passing.gif?ref=$BRANCH" --jq .size
          gh api "repos/$GITHUB_REPOSITORY/git/trees/$BRANCH?recursive=1" --jq '.tree[].path' > "$RUNNER_TEMP/tree.txt"
          dirs=$(grep -E "^pr-$PR/$NAME/[^/]+$" "$RUNNER_TEMP/tree.txt" || true)
          echo "directories for this PR: $dirs"
          test "$dirs" = "$dir"
          if grep -q "^pr-0/" "$RUNNER_TEMP/tree.txt"; then echo "expired directory not pruned"; exit 1; fi
          parents=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq '.parents | length')
          test "$parents" = 0
